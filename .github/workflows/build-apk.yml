name: Build APK BANGR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ouvrir le projet
        run: unzip -q bangr-projet.zip -d app
      - name: Installer et tester
        working-directory: app
        run: |
          npm install
          npm test
      - name: Construire le site
        working-directory: app
        run: npm run build
      - name: Creer le projet Android
        working-directory: app
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "BÃNGR" com.bangr.boutique --web-dir dist
          npx cap add android
      - name: Icone (facultatif)
        working-directory: app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon.png
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor "#0f4d2e" --iconBackgroundColorDark "#0f4d2e"
      - name: Synchroniser
        working-directory: app
        run: npx cap sync android
      - name: Cle de signature fixe
        run: |
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore
      - name: Construire l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bangr-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BANGR APK ${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
